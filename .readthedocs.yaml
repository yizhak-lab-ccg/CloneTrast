# Read the Docs configuration (v2).
# See https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    create_environment:
      - pip install --upgrade pip
      - pip install uv
      - uv pip install --system -e ".[docs]"
    build:
      html:
        - python -m sphinx -b html docs "${READTHEDOCS_OUTPUT}/html"
